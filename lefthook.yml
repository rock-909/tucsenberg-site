# Git Hooks管理配置
# 自动化质量门禁系统 - 确保代码质量和安全性
# 质量阈值通过保留的 starter proof / direct scripts 管理
pre-commit:
  parallel: true
  commands:
    # 代码格式检查 (Prettier)
    # 用 lefthook 官方 {staged_files} 模板 + glob 过滤，替代手写 git diff 管道
    # （$FILES 未加引号会在含空格文件名时碎裂）。纯 --check 不写文件，无 stage_fixed。
    format-check:
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,yml,yaml,css,scss,html}"
      run: pnpm exec prettier --check {staged_files}
      fail_text: '代码格式检查失败 - 请运行 pnpm exec prettier --write <files> 修复格式问题'

    # TypeScript类型检查（纯检查，不写文件——不挂 stage_fixed）
    type-check:
      run: pnpm type-check
      fail_text: 'TypeScript类型检查失败 - 请修复类型错误后重新提交'

    # 代码质量检查 (ESLint，纯检查不写文件——不挂 stage_fixed)
    quality-check:
      run: pnpm lint:check
      fail_text: '代码质量检查失败 - 发现新的质量问题，请修复后重新提交'

    # architecture-guard 于 2026-07-26 退役。它 grep diff 文本禁相对导入，而
    # eslint 的 no-restricted-imports 已经用 AST 管着 `../*`（上面 quality-check
    # 就在跑）。更糟的是它连 `./sibling` 一起禁，而 .claude/rules/coding-standards.md
    # 明写同目录相对导入是允许的——一个跟已定规则打架的门。`export *` 那半条是
    # "架构重构期间"的临时纪律，重构早结束了；真要守就加 eslint 规则，别 grep。

    # 多语言同步检查
    i18n-sync:
      run: |
        if git diff --cached --name-only | grep -E '^(messages/|content/|i18n\.(json|ts)$|src/.+i18n|translation\.config\.js)' >/dev/null; then
          node scripts/starter-checks.js translations
        else
          echo "跳过 i18n 同步检查（无相关变更）"; exit 0;
        fi
      fail_text: '翻译验证失败 - 请同步 messages 物理包与内容文件'
      stage_fixed: false

    structural-clusters-review:
      # vitest 把路径当过滤器：文件改名后它会安静地少跑一个，全没了还会
      # 因为 --passWithNoTests 直接 exit 0。先断言文件在，再跑。
      run: |
        for f in tests/unit/middleware.test.ts tests/integration/api/lead-family-contract.test.ts tests/integration/api/health.test.ts; do
          [ -f "$f" ] || { echo "❌ structural cluster 测试文件缺失: $f"; exit 1; }
        done
        pnpm exec vitest run tests/unit/middleware.test.ts tests/integration/api/lead-family-contract.test.ts tests/integration/api/health.test.ts
      fail_text: 'Structural cluster review 失败 - 请修复命中的 cluster contract / drift'
      stage_fixed: false

    # 相关测试检查 - 确保组件/库变更后测试同步更新
    # 使用 Vitest 4 的 `vitest related` 子命令
    #
    # `--passWithNoTests` 曾经决定这个门的成败：一个文件根本没有相关测试时，vitest
    # 打印 "No test files found" 然后 exit 0，钩子跟着报"相关测试检查通过"。也就是
    # 说"没测过"和"测过并通过"被合并成同一个结果——正是这个门声称要挡住的情况。
    #
    # 只排除两类：
    # - Storybook 故事：它们的证明在 CI 的 `storybook build`。
    # - `src/test/setup*`：`vitest.config.mts` 用 `setupFiles` 注入它们，不是被
    #   测试 import 进来的，所以它们结构上永远不在 `vitest related` 走的那张模块
    #   图里——这不是"没人证明"，是这个工具看不见。证明它们的车道是全量
    #   `pnpm test`：把服务端翻译 mock 改回返回 key 名，hero-section 的 7 条断言
    #   立刻红。改这类文件请跑全量，别只跑 related。
    #
    # 这里一度还按文件名排除了 App Router 的所有 page/layout/error/not-found，
    # 理由是"Playwright 冒烟逐页证明"。独立审查把这条打掉了：冒烟对每页只断言
    # HTTP 200 和一个 H1，而被排除的 `products/[market]/page.tsx` 有 495 行业务
    # 逻辑和 31 个现成的单测——改坏询价链接生成器，钩子照样绿。真正没有单测的
    # 只有 6 个文件，已经逐个补上，所以整条按角色排除都不需要了。
    test-related:
      run: |
        FILES=$(git diff --cached --name-only --diff-filter=ACM \
          | grep -E '^src/.+\.(ts|tsx)$' \
          | grep -v '\.test\.' | grep -v '\.spec\.' | grep -v '__tests__' \
          | grep -v '\.stories\.tsx$' \
          | grep -v '^src/test/setup' || true)
        if [ -z "$FILES" ]; then
          echo "✅ 相关测试检查跳过 (本次没有需要单测覆盖的源码变更)"; exit 0;
        fi
        echo "🧪 运行相关测试..."
        OUTPUT=$(pnpm vitest related $FILES --run --passWithNoTests --reporter=dot 2>&1) || {
          echo "$OUTPUT";
          echo ""; echo "❌ 相关测试失败 - 可能原因:";
          echo "  1. 组件 DOM 结构变更，但测试中的 getByRole/getByText 未同步";
          echo "  2. 接口属性变更，但 Mock 配置未更新";
          echo "  3. 函数签名变更，但测试断言未更新";
          echo ""; echo "💡 请检查并同步更新对应的测试文件";
          exit 1;
        }
        if echo "$OUTPUT" | grep -q "No test files found"; then
          echo "";
          echo "❌ 改动的源文件里，有文件没有任何相关测试：";
          echo "$FILES" | sed 's/^/     /';
          echo "";
          echo "💡 补一个测试。真的该由别的车道证明，就说清是哪条，并把排除规则写在";
          echo "   上面那个过滤器里——附上理由，别默默放行。";
          exit 1;
        fi
        echo "✅ 相关测试通过"
      fail_text: '相关测试失败 - 请确保源码变更后测试同步更新（参见 .claude/rules/testing.md Twin File Principle）'
      stage_fixed: false

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      fail_text:
        '提交信息不符合规范 - 请使用约定式提交格式：type(scope): description'

pre-push:
  parallel: false  # 串行执行，确保构建先完成
  commands:
    # 构建成功验证（A+：默认执行；紧急场景可用 RUN_FAST_PUSH=1 跳过）
    build-check:
      run: |
        if [ "$RUN_FAST_PUSH" = "1" ]; then
          echo "⏭️  RUN_FAST_PUSH=1: 跳过构建验证（仅用于紧急推送）";
        else
          node scripts/starter-checks.js content-manifest --check && node scripts/starter-checks.js content-slugs --strict-frontmatter && node scripts/starter-checks.js validate-production-config && pnpm build && node scripts/starter-checks.js client-boundary --build-artifacts
        fi
      fail_text: '构建验证失败 - 请修复构建错误后再推送'

    # 翻译验证（保持执行，速度快）
    translation-check:
      run: node scripts/starter-checks.js translations
      fail_text: '翻译验证失败 - 请确保所有翻译文件同步'

    # 架构检查（A+：全量巡航 + 循环依赖；使用 err 报告减少噪音；可用 RUN_FAST_PUSH=1 跳过应急推送）
    arch-check:
      run: |
        if [ "$RUN_FAST_PUSH" = "1" ]; then
          echo "⏭️  RUN_FAST_PUSH=1: 跳过架构检查（仅用于紧急推送，CI/后续本地请补跑）";
        else
          pnpm exec dependency-cruiser src --config .dependency-cruiser.js -T err
        fi
      fail_text: '架构检查失败 - 发现循环依赖或架构违规'

    # 安全检查（A+：本地执行；可用 RUN_FAST_PUSH=1 跳过应急推送）
    security-check:
      run: |
        if [ "$RUN_FAST_PUSH" = "1" ]; then
          echo "⏭️  RUN_FAST_PUSH=1: 跳过依赖安全审计 pnpm audit（仅用于紧急推送）。注意：PR CI 不跑 pnpm audit，只有 Semgrep 源码扫描；依赖 CVE 仅由每周 weekly-audit 工作流兜底——请尽快本地补跑";
        else
          pnpm audit --prod --audit-level moderate
        fi
      fail_text: '安全检查失败 - 发现安全漏洞，请修复后推送'

    # 死导出防复发门：全仓 knip 扫描，阻止零引用导出（尤其常量货架）无成本增长。
    # react-doctor 的 knip 规则只覆盖改动文件；此门补上全仓基线。忽略清单见 knip.json，
    # 治理面用 @public JSDoc 具名放行（参照 eslint-disable GSE 登记制）。
    dead-export-check:
      run: |
        if [ "$RUN_FAST_PUSH" = "1" ]; then
          echo "⏭️  RUN_FAST_PUSH=1: 跳过死导出扫描（CI quality 作业会跑 pnpm knip:check 兜底）";
        else
          pnpm knip:check
        fi
      fail_text: '死导出检查失败 - 发现零引用导出。删除它，或（若是有意的治理/公共面）用 @public JSDoc 具名放行'
